  <!--

  <meta property="og:image" content="https://niraj-chavan.github.io/niraj-chavan/assets/images/og-image.jpg">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://niraj-chavan.github.io/niraj-chavan/">

  <!--
    Icons. All generated from public/assets/icons/favicon.svg by
    `npm run icons` — edit the SVG, never the rasters.

    Order is deliberate: browsers that understand image/svg+xml take the vector
    and ignore the rest; the PNGs cover older Safari; the .ico covers legacy
    Windows contexts. apple-touch-icon must be opaque, so it is a separate file
    rather than a reuse of the PWA icon.

    Paths are root-relative and deliberately NOT written as %BASE_URL%...:
    Vite already rebases `/`-absolute URLs inside link[href], so adding the
    base here too produced /niraj-chavan/niraj-chavan/... — which the dev
    server answered with the SPA fallback (200, text/html), and a browser
    handed HTML where it expects an image simply shows no icon.
    a[href] is not rebased, so the noscript link below does use %BASE_URL%.
  -->
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/images/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/images/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="/assets/images/nc.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">

  <!--
    Theme bootstrap.

    Runs before first paint so the correct palette is applied with no flash of
    the wrong theme, and so `data-theme` is always present as the single source
    of truth for the CSS (there is no `prefers-color-scheme` fallback block to
    keep in sync). Kept inline and tiny on purpose.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!--
    Page loader — critical CSS, deliberately inline.

    The stylesheet is imported by the module entry, so on a cold reload the
    browser paints the raw document first: the skip link and the footer show as
    unstyled text above an empty <main> until the components upgrade. The
    overlay below covers that gap, and it can only do that if its styles are
    here — a rule in main.css would arrive with the very bundle we are waiting
    for.

    Colours are literals because the design tokens live in that same stylesheet.
    They mirror --bg-canvas / --text-primary / --text-secondary /
    --border-default / --accent for both themes, and are funnelled through the
    three custom properties below so each rule is written once. `data-theme` is
    already on <html> by this point (the bootstrap above), so the loader opens
    in the right palette and follows a later toggle.
  -->
  <style>
    .page-loader {
      --loader-ring: #3b82f6;
      --loader-track: #cdd9e8;
      --loader-glow: rgba(59, 130, 246, 0.18);

      position: fixed;
      inset: 0;
      /* Above --z-skip-link (1200), the highest layer in the token scale. */
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: #f2f6fc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      /* Last resort: if the bundle never runs, the overlay must not hold the
         page hostage. CSS-only, so it survives the failure that caused it. */
      animation: page-loader-timeout 400ms ease 8s forwards;
    }

    [data-theme='dark'] .page-loader {
      --loader-ring: #60a5fa;
      --loader-track: #33445c;
      --loader-glow: rgba(96, 165, 250, 0.16);

      background: #111c2e;
    }

    /* Dismissal state; `visibility` is delayed so the fade is seen out. */
    .page-loader--done {
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 320ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 320ms;
    }

    .page-loader__mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      /* Held back a beat: a warm reload then shows a calm canvas rather than a
         spinner that appears for a single frame. */
      animation: page-loader-appear 300ms cubic-bezier(0.22, 1, 0.36, 1) 180ms both;
    }

    /* The same soft glow the hero sits in. */
    .page-loader__mark::before {
      content: '';
      position: absolute;
      inset: -45%;
      background: radial-gradient(circle at center, var(--loader-glow) 0%, transparent 68%);
    }

    .page-loader__track {
      position: absolute;
      inset: 0;
      border: 3px solid var(--loader-track);
      border-radius: 50%;
    }

    /* A conic sweep masked down to a 3px ring — one element, no SVG. */
    .page-loader__ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 25%, var(--loader-ring) 100%);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
      animation: page-loader-spin 1s linear infinite;
    }

    .page-loader__monogram {
      position: relative;
      font-family: 'Newsreader', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
      font-size: 1.375rem;
      letter-spacing: 0.02em;
      color: #0b1a2b;
    }

    [data-theme='dark'] .page-loader__monogram {
      color: #f7fafd;
    }

    .page-loader__text {
      margin: 0;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #33475e;
      animation: page-loader-appear 300ms cubic-bezier(0.22, 1, 0.36, 1) 260ms both;
    }

    [data-theme='dark'] .page-loader__text {
      color: #c9d6e6;
    }

    @keyframes page-loader-spin {
      to { transform: rotate(1turn); }
    }

    @keyframes page-loader-appear {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes page-loader-timeout {
      to { opacity: 0; visibility: hidden; }
    }

    /* accessibility.css is not loaded yet, so the preference is honoured here
       too: the ring becomes a static band and nothing travels. */
    @media (prefers-reduced-motion: reduce) {
      .page-loader__ring {
        background: conic-gradient(var(--loader-ring), var(--loader-ring));
        opacity: 0.5;
        animation: none;
      }

      .page-loader__mark,
      .page-loader__text {
        animation-duration: 1ms;
      }
    }
  </style>

  <!-- Without scripting nothing will ever dismiss it, and the <noscript>
       message in the body is the thing worth reading. -->
  <noscript>
    <style>
      .page-loader { display: none; }
    </style>
  </noscript>

  <!-- Fonts: Newsreader (display serif) + Inter (UI/body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">

  <meta name="theme-color" content="#111C2E" media="(prefers-color-scheme: dark)">

</head>
<body>
  <!--
    Covers the page until the components have rendered; removed by
    scripts/utils/page-loader.js. Nothing in here is focusable, so the skip
    link below remains the first tab stop.
  -->
  <div class="page-loader" id="page-loader" role="status">
    <div class="page-loader__mark">
      <span class="page-loader__track" aria-hidden="true"></span>
      <span class="page-loader__ring" aria-hidden="true"></span>
      <span class="page-loader__monogram" aria-hidden="true">NC</span>
    </div>
    <p class="page-loader__text">Loading</p>
  </div>

  <!-- Bypass block — first focusable element on the page (WCAG 2.4.1) -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Decorative scroll progress; the browser scrollbar already conveys this -->
  <div class="scroll-indicator" aria-hidden="true">
    <div class="scroll-indicator__bar"></div>
  </div>

  <theme-toggle></theme-toggle>

  <app-sidebar></app-sidebar>

  <noscript>
    <p style="padding:1.5rem;max-width:42rem;margin:0 auto;">
      This portfolio is rendered with JavaScript. Please enable JavaScript, or
      <a href="%BASE_URL%assets/documents/Niraj-Chavan.pdf">download the CV (PDF)</a>
      for the same information.
    </p>
  </noscript>

  <!--
    `tabindex="-1"` makes the skip link actually move focus here; without it
    most browsers scroll but leave focus at the top of the document.
    Each section element carries its own id — they are not duplicated onto
    these custom-element wrappers.
  -->
  <main id="main" class="app-main" tabindex="-1">
    <section-hero></section-hero>
    <section-about></section-about>
    <section-skills></section-skills>
    <section-education></section-education>
    <section-experience></section-experience>
    <section-portfolio></section-portfolio>
    <section-contact></section-contact>
  </main>

  <footer class="site-footer">

      <p>&copy; <span data-current-year>2026</span> Niraj Chavan. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
