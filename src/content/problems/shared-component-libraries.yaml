# Chase Travel at JP Morgan Chase. Every statement here is already published
# on the Chase Travel — Offers & Purchase Flow project page or in the résumé:
# the duplicated promotion UI, the shared Angular library, its three
# downstream squads, and the trade-offs of sharing it across Module
# Federation remotes. Keep it to general terms: no internal figures, names or
# system detail (see the portfolio-content skill's JP Morgan Chase section).
# Lessons are left out until Niraj gives his own.
title: Teams rebuilding the same components, slightly differently
order: 4
domain: design-systems
context: JP Morgan Chase & Co. · Chase Travel
problem: >-
  Promotions appear on many squads' pages across Chase Travel, and each squad
  rendered them its own way, so the same UI was built several times over and
  promotions could look and behave differently from page to page.
challenge: >-
  Replace several squads' own promotion components with one implementation
  they would build on. Once squads depend on a shared library, it becomes a product with consumers: every change
  needs versioning and backward compatibility for all of them.
analysis: >-
  Rendering a promotion was the same job done in several places, so the
  duplication could be removed by giving it one owner and one
  implementation. The library also had to fit the way Chase Travel ships.
  Squads deploy their parts independently through micro-frontend boundaries,
  so shared code such as Angular and the component library has to be
  versioned and shared deliberately across them.
solution: >-
  I architected a reusable Angular component library for promotion
  rendering: one implementation of every promotion pattern, which downstream
  squads build their features on instead of maintaining their own.
stack: [Angular, TypeScript, Component libraries]
results:
  - Adopted by three downstream squads, which render promotions with it instead of building their own.
  - One implementation of every promotion pattern, maintained in one place.
caseStudy: microfrontend-architecture
