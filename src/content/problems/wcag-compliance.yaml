# Xpanxion (2017 – 2019). The résumé fact is "led WCAG 2.0 compliance across
# all application features". The rest was written by Claude from standard
# practice (the W3C WCAG-EM method, WAI-ARIA Authoring Practices), and on
# 2026-11-14 Niraj asked Claude to pick the best version and publish it.
# Kept general on purpose: no tool names beyond axe, and no figures.
title: Making an existing product accessible without stopping delivery
order: 3
domain: accessibility
context: Xpanxion · enterprise Angular applications
problem: >-
  Accessibility became a requirement for applications that were already in
  production. Their features hadn't been built with keyboard or
  screen-reader users in mind, so parts of them were hard or impossible to
  use without a mouse or without sight.
challenge: >-
  Bring every feature up to WCAG 2.0 without stopping feature delivery, in
  a team that had little accessibility experience, and make sure new work
  didn't undo the fixes.
analysis: >-
  I audited each feature against WCAG 2.0. Automated checks with axe found
  the issues a machine can find, such as missing labels and low contrast.
  Because automated tools catch only part of the problems, I then tested
  each flow by hand, using only the keyboard and a screen reader. I ranked
  the fixes by their impact on users: anything that blocked a task, such as
  a keyboard trap, an unlabelled form field or focus that disappeared, came
  before cosmetic issues.
solution: >-
  I led the remediation feature by feature, alongside normal delivery. That
  meant semantic HTML in place of clickable divs, labels and error messages
  tied to their fields, a visible focus indicator, focus managed when
  dialogs open and close, and ARIA only where native HTML couldn't do the
  job. I wrote standards for semantic HTML, keyboard support and responsive
  design, and checked them in code review, so new features were accessible
  from the start.
stack: [Angular, HTML, ARIA, axe DevTools]
results:
  - Every application feature brought up to WCAG 2.0.
  - New features built accessible from the start, with the standards checked in code review.
lessons:
  - >-
    Accessibility is far cheaper as a habit than as a project. Building it
    into shared components and code review costs little; retrofitting it
    across a finished product costs a lot.
  - >-
    Automated checks are a starting point, not a verdict. Most of the issues
    that block real users only show up when you try the flow with a keyboard
    and a screen reader.
