# Expertise by area. Levels are my own self-assessment (carried over from the
# previous site); skills I have not rated have no level. Every `context` line
# restates something the experience or project entries already say. Evidence ids:
#   roles: experience.yaml ids · projects: src/content/projects · caseStudies:
#   src/content/case-studies (drafts are dropped from production automatically).

- id: frontend
  order: 1
  area: Frontend engineering
  summary: >-
    The part users actually touch — and where I have spent most of my career.
  skills:
    - name: Angular
      level: Expert
      context: Enterprise applications at JP Morgan Chase, Schlumberger and Xpanxion — modular component architecture, JWT auth, lazy-loaded features.
      roles: [jpmc, slb, xpanxion]
      caseStudies: [authentication-platform]
    - name: TypeScript
      level: Expert
      context: Typed Angular and React codebases at JP Morgan Chase and Xpanxion.
      roles: [jpmc, xpanxion]
    - name: RxJS
      level: Expert
      context: Async data flows and state in Angular applications.
      roles: [jpmc, xpanxion]
    - name: React
      level: Advanced
      context: Product work at JP Morgan Chase and Schlumberger, and my own Rxbit and Nexpenso; ShredTrack is built on Next.js.
      roles: [jpmc, slb]
      projects: [rxbit, nexpenso, shredtrack]
    - name: State management
      level: Advanced
      context: NgRx and RxJS services in Angular; Redux in React — Nexpenso's state lives in Redux.
      projects: [nexpenso]
    - name: HTML & CSS
      level: Expert
      context: Semantic, accessible markup converted from PSD and Sketch designs for large e-commerce sites.
      roles: [connect91]
    - name: Responsive design
      level: Expert
      context: Led responsive implementation across devices at Schlumberger; mobile-first layouts at Connect | 91.
      roles: [slb, connect91]
    - name: Sass / SCSS
      level: Expert
      context: Built the Sass framework and token system behind large e-commerce front ends at Connect | 91.
      roles: [connect91]
    - name: Tailwind CSS
      level: Advanced
      context: Utility-first styling over semantic design tokens — this site is built that way.

- id: architecture
