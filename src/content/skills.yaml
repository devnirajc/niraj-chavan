- id: frontend
  order: 1
  area: Frontend engineering
  summary: >-
    The part users actually touch — and where I have spent most of my career.
  skills:
    - name: Angular
      level: Expert
      context: Chase Travel at JP Morgan Chase — the purchase flow from trip cart to confirmation, micro-frontends, a shared promotion component library and the Site Manager admin platform — plus enterprise applications at Schlumberger and Xpanxion.
      roles: [jpmc, slb, xpanxion]
      projects: [chase-travel-booking, chase-travel-site-manager, scoperetail, k7-security]
      caseStudies: [authentication-platform]
    - name: TypeScript
      level: Expert
      context: Typed Angular codebases at JP Morgan Chase, where I mentor engineers on TypeScript best practices, and at Xpanxion.
      roles: [jpmc, xpanxion]
      projects: [chase-travel-booking]
    - name: RxJS
      level: Expert
      context: Async data flows and state in Angular applications, including K7 Computing's consumer console and antivirus dashboard.
      roles: [jpmc, xpanxion]
      projects: [k7-security]
    - name: React
      level: Advanced
      context: My side projects — Rxbit and Nexpenso are React single-page apps, and ShredTrack is built on Next.js — and earlier at Schlumberger, where I planned an internal application's migration from Angular to React and saw it into production.
      roles: [slb]
      projects: [rxbit, nexpenso, shredtrack]
    - name: State management
      level: Advanced
      context: NgRx and RxJS services in Angular; Redux in React — Nexpenso's state lives in Redux.
      projects: [nexpenso]
    - name: HTML & CSS
      level: Expert
      context: Semantic, accessible markup converted from PSD and Sketch designs for large e-commerce sites.
      roles: [connect91]
