      level: Expert
      context: Led responsive implementation across devices at Schlumberger; responsive, cross-browser pages for Holland America Line's cruise site at Xpanxion; mobile-first layouts at Connect 91.
      roles: [slb, connect91]
      projects: [holland-america]
    - name: Sass / SCSS
      level: Expert
      context: Built the Sass framework and token system behind large e-commerce front ends at Connect 91.
      roles: [connect91]
    - name: Tailwind CSS
      level: Advanced
      context: Utility-first styling over semantic design tokens — this site is built that way.

