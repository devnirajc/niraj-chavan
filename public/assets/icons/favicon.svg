<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <title>Niraj Chavan</title>
  <!--
    Primary favicon, and the source every raster icon is generated from
    (scripts/generate-icons.js).

    Navy tile with an electric-blue "N", the same pair the site uses
    (navy-900 / blue-400). They sit at 6.7:1 against each other, so the
    letterform still reads at 16px. A dark tile also keeps its edges on both
    light and dark browser chrome, which a mist-coloured tile would not.

    The letter is a path, not a text element: a favicon cannot rely on any
    font being available in the rendering context.
  -->
  <rect width="64" height="64" rx="14" fill="#111c2e"/>
  <path d="M18 48V16h10l10 20V16h10v32H38L28 28v20z" fill="#60a5fa"/>
</svg>
