<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <title>Niraj Chavan</title>
  <!--
    Primary favicon, and the source every raster icon is generated from
    (scripts/generate-icons.js).

    Ink tile with an indigo "N": the gray-900 and indigo-300 tokens from
    src/styles/tokens.css, about 10:1 against each other, so the letterform
    still reads at 16px. A dark tile keeps its edges on both light and dark
    browser chrome.

    The letter is a path, not a text element: a favicon cannot rely on any
    font being available in the rendering context.
  -->
  <rect width="64" height="64" rx="14" fill="#0c0e12"/>
  <path d="M18 48V16h10l10 20V16h10v32H38L28 28v20z" fill="#a5b4fc"/>
</svg>
